; Separate Arduino Nano ATmega328P power/enable controller.

[env:powerctl]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_flags =
    -D DEVICE_ID=\"powerctl\"
upload_speed = 115200

[env:native]
platform = native
test_framework = unity
build_flags =
    -D UNIT_TEST
    -D DEVICE_ID=\"powerctl\"
    -I test/support
test_build_src = yes
build_src_filter =
    -<*>
    +<utils/Parser.cpp>
    +<power/PowerDevice.cpp>
    +<power/PowerController.cpp>
    +<protocol/SerialProtocol.cpp>
